# HyperWebster — middle-button drag-to-scroll (broken scroll-wheel workaround)
# Hold mouse button 274 (middle / scroll-wheel click) and move to scroll.
# Short middle-clicks still paste / activate middle-click actions.
#
# Optional: set scroll_button_lock = true to toggle scroll mode with a click
# instead of holding. Change scroll_button if wev reports a different code.

input {
    scroll_method = on_button_down
    scroll_button = 274
    scroll_button_lock = false
}
